name: Deploy web

# Deploys marketing and the product app to Cloudflare Workers after CI passes on main.
# Inert until the repository variable DEPLOY_WEB is "true" (docs/DEPLOYMENT.md step 5).
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  # Rebuilds main by hand, e.g. after changing a NEXT_PUBLIC_* repository variable.
  workflow_dispatch:

concurrency:
  group: deploy-web
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      vars.DEPLOY_WEB == 'true' && (github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'))
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      NEXT_PUBLIC_GIGACAD_API_URL: ${{ vars.NEXT_PUBLIC_GIGACAD_API_URL }}
      NEXT_PUBLIC_GIGACAD_APP_URL: ${{ vars.NEXT_PUBLIC_GIGACAD_APP_URL }}
      NEXT_PUBLIC_GIGACAD_SITE_URL: ${{ vars.NEXT_PUBLIC_GIGACAD_SITE_URL }}
      NEXT_PUBLIC_GITHUB_AUTH_ENABLED: ${{ vars.NEXT_PUBLIC_GITHUB_AUTH_ENABLED }}
      NEXT_PUBLIC_GOOGLE_AUTH_ENABLED: ${{ vars.NEXT_PUBLIC_GOOGLE_AUTH_ENABLED }}
      NEXT_PUBLIC_BILLING_ENABLED: ${{ vars.NEXT_PUBLIC_BILLING_ENABLED }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Next bundles @gigacad/core from its build output.
      - run: pnpm --filter @gigacad/core build
      # `run` matters: bare `pnpm deploy` is a built-in pnpm command.
      - run: pnpm --filter @gigacad/web run deploy
      # The e2e job runs `next start`; this checks the real Workers build once it's live.
      - name: Check every page type on the live site
        run: sleep 15 && scripts/check-site.sh
