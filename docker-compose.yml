# Local stand-in for Cloudflare R2. Supabase runs separately via `supabase start`.
services:
  minio:
    image: quay.io/minio/minio:latest
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: gigacad
      MINIO_ROOT_PASSWORD: gigacad-local-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  minio-setup:
    image: quay.io/minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 gigacad gigacad-local-secret; do sleep 1; done;
      mc mb --ignore-existing local/gigacad
      "

volumes:
  minio-data:
