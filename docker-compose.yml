# Local stand-in for Cloudflare R2. Supabase runs separately via `supabase start`.
# SeaweedFS replaced MinIO, which no longer publishes container images.
services:
  s3:
    image: chrislusf/seaweedfs:4.47
    command: server -dir=/data -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json
    ports:
      - "9000:8333"
    volumes:
      - ./docker/seaweedfs-s3.json:/etc/seaweedfs/s3.json:ro
      - s3-data:/data

  s3-setup:
    image: amazon/aws-cli:latest
    depends_on:
      - s3
    environment:
      AWS_ACCESS_KEY_ID: gigacad
      AWS_SECRET_ACCESS_KEY: gigacad-local-secret
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: >
      /bin/sh -c "
      until aws --endpoint-url http://s3:8333 s3api list-buckets > /dev/null 2>&1; do sleep 1; done;
      aws --endpoint-url http://s3:8333 s3api create-bucket --bucket gigacad 2>/dev/null || true
      "

volumes:
  s3-data:
