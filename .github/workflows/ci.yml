name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# The web build needs these at compile time; any well-formed values work for CI.
env:
  NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
  NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder
  NEXT_PUBLIC_GIGACAD_API_URL: http://127.0.0.1:8787
  NEXT_PUBLIC_GIGACAD_APP_URL: http://localhost:3000

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: scripts/check-secrets.sh
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm --filter @gigacad/cli smoke

  # GigaCAD for macOS: its tests (the lock tests need macOS), the shell-version check, and a
  # packaged DMG to try. Optional until it has proved stable.
  desktop:
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          # check-shell compares against where this branch left main.
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm vitest run clients/desktop
      - run: node clients/desktop/scripts/check-shell.mjs origin/main
      # Signed with a throwaway key: this DMG only runs bundles built on the same runner.
      - run: pnpm --filter @gigacad/desktop dist
      - uses: actions/upload-artifact@v4
        with:
          name: GigaCAD-macOS
          path: clients/desktop/dist/*.dmg

  # GigaCAD on Windows: the desktop app's tests (with its plugin pipe on real named pipes), the
  # add-in protocol library on .NET 10 and .NET Framework 4.8 (the SolidWorks add-in's runtime),
  # the .NET Framework client talking to the app's pipe server, and an installer to try.
  windows:
    runs-on: windows-latest
    env:
      # The plugin tests don't start Electron; skip its 100 MB download.
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: clients/windows/global.json
      # Also builds the interop client for both frameworks.
      - run: dotnet test clients/windows/GigaCAD.Windows.sln -c Release
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm vitest run clients/desktop
        env:
          GIGACAD_INTEROP: "1"
          GIGACAD_INTEROP_TFM: net48
          GIGACAD_INTEROP_CONFIGURATION: Release
      # Unsigned, with a throwaway update key and no icons (they're rendered on a Mac): for trying
      # the app on a PC, not for shipping. The desktop-release workflow builds the real one.
      - run: node clients/desktop/scripts/dist.mjs --allow-missing-icons
      - uses: actions/upload-artifact@v4
        with:
          name: GigaCAD-Windows
          path: clients/desktop/dist/*.exe

  # The image Railway deploys. Building it catches files missing from its COPY lines.
  api-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f Dockerfile.api -t gigacad-api .

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: pnpm install --frozen-lockfile
      # SeaweedFS stands in for R2; s3-setup waits for it and creates the bucket.
      - run: docker compose up -d s3 && docker compose run --rm s3-setup
      # Storage first: it needs no database and fails fast.
      - run: pnpm vitest run --config vitest.integration.config.ts apps/api/test/storage.int.test.ts
      # Applies supabase/migrations to a fresh local stack.
      - run: supabase start
      - run: pnpm test:integration

  # Browser tests against the whole local stack: the release flow, live refresh, and
  # the status of every page type.
  e2e:
    runs-on: ubuntu-latest
    env:
      # `supabase start` signs with its well-known demo keys; these match it.
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.CRXP1A7WOeoJeXxjNni43kdQwgnWNReilDMblYTn_I0
      NEXT_PUBLIC_GIGACAD_SITE_URL: http://localhost:3000
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
      SUPABASE_URL: http://127.0.0.1:54321
      SUPABASE_JWT_SECRET: super-secret-jwt-token-with-at-least-32-characters-long
      S3_ENDPOINT: http://127.0.0.1:9000
      S3_REGION: us-east-1
      S3_BUCKET: gigacad
      S3_ACCESS_KEY_ID: gigacad
      S3_SECRET_ACCESS_KEY: gigacad-local-secret
      S3_FORCE_PATH_STYLE: "true"
      WEB_ORIGIN: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: pnpm install --frozen-lockfile
      - run: docker compose up -d s3 && docker compose run --rm s3-setup
      - run: supabase start
      - run: pnpm --filter "@gigacad/api..." --filter "@gigacad/web..." build
      - run: pnpm --filter @gigacad/web exec playwright install --with-deps chromium
      # Playwright starts the API and web app itself (playwright.config.ts).
      - run: pnpm --filter @gigacad/web e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
